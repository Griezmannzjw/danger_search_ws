# 定位与建图模块参数
# 对齐接口规范 v1.1-p0

# 坐标系
map_frame: map
odom_frame: odom
base_frame: base
world_frame: world

# 话题
map_topic: /map
pose_topic: /localization/pose
mapping_status_topic: /mapping/status
lidar_topic: /livox/Pointcloud2
imu_topic: /trunk_imu

# 地图参数
map_resolution: 0.05      # 5cm分辨率
map_width: 400            # 20m
map_height: 720           # 36m
map_origin_x: -10.0       # 地图原点X
map_origin_y: -18.0       # 地图原点Y

# 激光参数
lidar_max_range: 5.0
lidar_min_range: 0.1
