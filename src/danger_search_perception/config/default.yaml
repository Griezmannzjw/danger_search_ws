# 危险源感知模块参数
# 对齐接口规范 v1.1-p0

# 坐标系与当前楼层
map_frame: map
target_frame: map
base_frame: base
floor_id: 0
mapping_status_topic: /mapping/status
localization_status_topic: /localization/status
# 正式 map 输出只有在当前楼层地图健康稳定时才允许发布。
require_stable_mapping: true
mapping_status_timeout_s: 1.5
# 每个检测都携带采集期间的定位修正版本；版本变化中的帧整帧丢弃。
require_localization_status: true
localization_status_timeout_s: 1.5
# 用图像采集时刻的 map->base 高度复核楼层，避免换层瞬间错标。
verify_floor_height: true
floor_heights: [0.0, 2.6, 5.2]
floor_height_tolerance_m: 0.45

# 话题
rgb_topic: /real_sense/rgb/image_raw
depth_topic: /real_sense/depth/image_raw
camera_info_topic: /real_sense/rgb/camera_info
detections_topic: /danger_detector/detections
status_topic: /danger_detector/status

# RGB、深度和内参近似时间同步
sync_queue_size: 10
sync_slop_s: 0.05

# 感知能力与状态；球心三维距离超出可靠范围时不发布检测
reliable_min_range: 0.4
reliable_max_range: 5.0
input_fresh_timeout_s: 1.0
capability_version: 1

# 同楼层三维跨帧关联。暂定轨迹短时过期；确认轨迹在本次节点进程中保留，
# 返回旧楼层时仍可沿用原 track_id。
tracking_enabled: true
track_association_distance_m: 0.40
track_confirmation_hits: 3
track_tentative_timeout_s: 1.0
track_confirmed_timeout_s: 0.0
track_initial_position_variance_m2: 0.0064
track_minimum_position_variance_m2: 0.0004

# HSV 红色双区间
red_h_low_1: 0
red_h_high_1: 10
red_h_low_2: 170
red_h_high_2: 180
red_s_low: 120
red_v_low: 80

# 形态学操作
morph_open_ksize: 3
morph_close_ksize: 5

# 二维候选过滤
min_blob_area: 50
max_blob_area: 100000
min_circularity: 0.65
min_circle_fill_ratio: 0.72
min_aspect_ratio: 0.65
max_aspect_ratio: 1.50
reject_border_candidates: true
border_margin_px: 2

# 深度过滤；与当前 P0 可靠检测范围保持一致
min_depth_m: 0.4
max_depth_m: 5.0
min_valid_depth_ratio: 0.45
depth_mad_scale: 3.5
max_points_per_candidate: 1500

# 已知半径球面验证与红色平面（方块）排除
expected_radius_m: 0.15
radius_tolerance_m: 0.07
sphere_inlier_threshold_m: 0.035
max_sphere_residual_m: 0.035
min_sphere_inlier_ratio: 0.55
enable_plane_rejection: true
max_plane_residual_m: 0.006
plane_vs_sphere_ratio: 0.45

# TF 与发布
confidence_threshold: 0.60
tf_timeout_s: 0.10
publish_empty_array: true
