TrajectoryPlannerROS:
  odom_topic: /localization/odom

  max_vel_x: 0.40
  # Unitree's RL gait does not reliably leave its standing response at the
  # generic 0.10 m/s ROS floor.  Keep the vendor TrajectoryPlannerROS floor;
  # cmd_mux still ramps this target and caps it at 0.40 m/s.
  min_vel_x: 0.30
  # This legacy spelling is read during plugin construction, before dynamic
  # reconfigure owns max_vel_theta.
  # Reuse the Unitree TrajectoryPlannerROS turning baseline, bounded by the
  # cmd_mux angular-speed hard limit.  The RL policy needs a substantial yaw
  # command to leave its standing response; 0.25 rad/s was ineffective.
  max_rotational_vel: 0.80
  max_vel_theta: 0.80
  min_vel_theta: -0.80
  min_in_place_vel_theta: 0.80
  escape_vel: -0.30

  acc_lim_x: 0.50
  acc_lim_y: 0.50
  acc_lim_theta: 0.80

  holonomic_robot: true
  # BaseLocalPlannerConfig declares this as a comma-delimited string.  Keep a
  # true straight candidate so a centered corridor does not require strafing.
  y_vels: "-0.10, 0.0, 0.10"
  dwa: true

  xy_goal_tolerance: 0.40
  yaw_goal_tolerance: 0.80
  latch_xy_goal_tolerance: true

  sim_time: 3.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 12
  vtheta_samples: 40

  meter_scoring: true
  # BaseLocalPlannerConfig clamps both dynamic parameters to <= 5.0.
  # Keeping the values within that official range lets the runtime guard prove
  # that the requested scoring is actually active.
  path_distance_bias: 5.0
  goal_distance_bias: 5.0
  occdist_scale: 0.01
  heading_scoring: true
  heading_lookahead: 0.80
  heading_scoring_timestep: 0.80
  oscillation_reset_dist: 0.05
  escape_reset_dist: 0.10
  escape_reset_theta: 1.57
  prune_plan: true
  simple_attractor: false
  publish_cost_grid_pc: false
