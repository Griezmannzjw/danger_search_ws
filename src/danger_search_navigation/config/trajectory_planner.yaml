TrajectoryPlannerROS:
  odom_topic: /localization/odom

  max_vel_x: 0.40
  min_vel_x: 0.30
  max_vel_theta: 0.80
  min_vel_theta: -0.80
  min_in_place_vel_theta: 0.80
  escape_vel: -0.30

  acc_lim_x: 0.50
  acc_lim_y: 0.50
  acc_lim_theta: 0.80

  holonomic_robot: true
  y_vels: [-0.20, -0.10, 0.10, 0.20]
  dwa: true

  xy_goal_tolerance: 0.40
  yaw_goal_tolerance: 0.80
  latch_xy_goal_tolerance: true

  sim_time: 3.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 12
  vtheta_samples: 40

  meter_scoring: true
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.01
  heading_scoring: true
  heading_lookahead: 0.80
  heading_scoring_timestep: 0.80
  oscillation_reset_dist: 0.05
  escape_reset_dist: 0.10
  escape_reset_theta: 1.57
  prune_plan: true
  simple_attractor: false
  publish_cost_grid_pc: false

