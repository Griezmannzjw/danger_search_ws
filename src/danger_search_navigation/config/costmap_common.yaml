transform_tolerance: 0.50
resolution: 0.05

# Fixed conservative A1 envelope.  DWAPlannerROS/costmap recovery use this
# footprint at initialization, so it must not be replaced with a gait-varying
# polygon at runtime.
footprint:
  - [0.30, 0.15]
  - [0.30, -0.15]
  - [-0.35, -0.15]
  - [-0.35, 0.15]
footprint_padding: 0.04

obstacle_range: 3.0
raytrace_range: 4.0
# LaserScan points are transformed into the absolute multi-floor map/odom z.
# Floor 2 is at 5.2m, so the former 1.0m ceiling silently disabled dynamic
# obstacle marking upstairs.
max_obstacle_height: 7.0
min_obstacle_height: -0.30
