transform_tolerance: 0.50
resolution: 0.05

# Fixed conservative A1 envelope.  TrajectoryPlannerROS snapshots this
# footprint at initialization, so it must not be replaced with a gait-varying
# polygon at runtime.
footprint:
  - [0.30, 0.15]
  - [0.30, -0.15]
  - [-0.35, -0.15]
  - [-0.35, 0.15]
footprint_padding: 0.04

obstacle_range: 3.0
raytrace_range: 4.0
max_obstacle_height: 1.0
min_obstacle_height: -0.30

