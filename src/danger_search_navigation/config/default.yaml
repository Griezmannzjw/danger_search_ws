# Private parameters for nav_controller.py.  competition.launch loads this
# file inside the navigation node namespace.

# Frames
map_frame: map
base_frame: base
lidar_frame: laser_livox

# Frozen interfaces
nav_cmd_topic: /danger_search/nav_cmd_vel
pose_topic: /localization/pose
map_topic: /map
mapping_status_topic: /mapping/status
health_topic: /navigation/health
obstacle_cloud_topic: /scan
safety_stop_topic: /danger_search/safety_stop
move_base_action_name: /move_base
make_plan_service: /move_base/make_plan
clear_costmaps_service: /move_base/clear_costmaps

# Global planning on the same inflated OccupancyGrid used by Action execution.
occupied_threshold: 65
robot_radius: 0.30
inflation_padding: 0.10
allow_diagonal: true
max_planner_expansions: 75000

# Message validity and freshness
pose_timeout: 0.50
map_timeout: 2.00
mapping_status_timeout: 1.50
obstacle_cloud_timeout: 0.50
goal_stamp_timeout: 2.00
max_future_stamp_skew: 0.05
quaternion_norm_tolerance: 0.05
require_obstacle_cloud: true

# Raw /scan LiDAR pose in base.  Keep these explicit; no TF or truth odometry
# is consumed by navigation.
lidar_x: 0.20
lidar_y: 0.00
lidar_z: 0.08
lidar_roll: 0.00
lidar_pitch: 0.785
lidar_yaw: 0.00
obstacle_min_z: -0.30
obstacle_max_z: 0.80
obstacle_range_min: 0.15
obstacle_range_max: 8.00
zero_point_radius: 0.05
obstacle_max_points: 2000
dynamic_stop_distance: 0.60
dynamic_front_half_angle: 0.52

# Non-holonomic path tracking and action lifecycle
control_rate: 20.0
health_rate: 5.0
goal_timeout: 60.0
goal_tolerance_xy: 0.30
goal_tolerance_yaw: 0.20
lookahead_distance: 0.60
cruise_speed: 0.20
max_linear_speed: 0.30
max_angular_speed: 0.80
max_linear_accel: 0.40
max_angular_accel: 0.80
max_decel: 0.50
rotate_in_place_angle: 0.45
rotate_in_place_gain: 1.50
final_yaw_gain: 1.20
replan_period: 1.00
replan_min_interval: 0.25
replan_deviation_distance: 0.50
stuck_timeout: 5.00
progress_distance: 0.10
stuck_command_speed: 0.05
