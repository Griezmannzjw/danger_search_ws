# nav_controller.py 的节点私有参数。competition.launch 已在 navigation 节点内加载本文件。

# 坐标系和冻结接口
map_frame: map
base_frame: base
lidar_frame: laser_livox
nav_cmd_topic: /danger_search/nav_cmd_vel
sent_cmd_topic: /danger_search/cmd_vel_sent
pose_topic: /localization/pose
map_topic: /map
mapping_status_topic: /mapping/status
health_topic: /navigation/health
obstacle_cloud_topic: /scan
safety_stop_topic: /danger_search/safety_stop
posture_fallen_topic: /danger_search/posture_fallen
move_base_action_name: /move_base
make_plan_service: /move_base/make_plan
clear_costmaps_service: /move_base/clear_costmaps

# 共享 OccupancyGrid A*。未知格以及达到 occupied_threshold 的格不可通行；
# 0..64 的低占据概率格允许通行，避免概率地图中的轻微噪声被当成实体墙。
occupied_threshold: 65
robot_radius: 0.30
# 静态 A* 保持机器人本体半径；最终完整 footprint 扫掠仍是硬约束。
inflation_padding: 0.00
# 已确认 /scan 障碍仅作轻量预膨胀，最终由 footprint 扫掠复核。
dynamic_inflation_radius: 0.15
allow_diagonal: true
max_planner_expansions: 75000

# 消息合法性和新鲜度门。pose/map 的源时间由 /mapping/status 统一判定；
# 这两个值保留用于参数兼容，导航不再用它们淘汰合法的缓存地图/位姿。
pose_timeout: 2.00
map_timeout: 5.00
mapping_status_timeout: 1.50
obstacle_cloud_timeout: 1.00
goal_stamp_timeout: 2.00
max_future_stamp_skew: 0.05
quaternion_norm_tolerance: 0.05
# 若为 true，缺失、过期或帧错误的 /scan 会安全结束活动目标。
require_obstacle_cloud: true

# /scan 到 base 的外参由消息 frame 和时间戳对应的 TF 提供。以下旧参数仅为
# 兼容历史配置保留，navigation 不再用手工旋转变换点云。
lidar_x: 0.20
lidar_y: 0.00
lidar_z: 0.08
lidar_roll: 0.00
lidar_pitch: 0.00
lidar_yaw: 0.00
obstacle_min_z: -0.30
obstacle_max_z: 0.80
obstacle_range_min: 0.15
obstacle_range_max: 8.00
zero_point_radius: 0.05
obstacle_max_points: 2000
# /scan 点先通过 TF 转到 base，再删除 A1 二维 footprint 内（含边界）的自体点。
# 这里不含规划膨胀余量；footprint 外的真实近障仍须参与停车和动态障碍膨胀。
obstacle_footprint_min_x: -0.35
obstacle_footprint_max_x: 0.30
obstacle_footprint_min_y: -0.15
obstacle_footprint_max_y: 0.15
# 规划 footprint 从 URDF 腿部 TF 动态生成；以下参数控制短时步态扫掠和保底外扩。
footprint_padding: 0.04
footprint_history_seconds: 0.40
footprint_timeout: 0.50
# A* 在硬膨胀外继续惩罚低净空单元，把路线推向通道中央。
clearance_soft_margin: 0.15
clearance_cost_weight: 1.0
dynamic_stop_distance: 0.60
dynamic_front_half_angle: 0.52
# A* 只接收最近 3 个不同 /scan 时间戳中至少出现 2 次的动态栅格。
# 已确认栅格在最后一次观测后保留 0.50 s；这不是点云新鲜度 timeout。
dynamic_confirmation_frames: 3
dynamic_confirmation_hits: 2
dynamic_obstacle_ttl: 0.50

# 目标被门框或临时障碍占据时，在目标容差内寻找安全落点。
goal_projection_max_radius: 0.40
goal_projection_step: 0.05
# 投影终点仅用于内部跟踪；Action 仍需满足原始目标容差。
projection_tracking_tolerance: 0.10

# DWA/DWB 式直行优先路径跟踪、最终朝向和事件触发重规划。
control_rate: 20.0
health_rate: 5.0
goal_timeout: 120.0
# 规划短暂失败时保持零速并重试的容忍时间；cmd_mux 仍独立使用 0.5 s 看门狗。
planning_failure_tolerance_s: 5.0
goal_tolerance_xy: 0.45
goal_tolerance_yaw: 0.35
lookahead_distance: 0.60
cruise_speed: 0.35
max_linear_speed: 0.35
max_angular_speed: 0.50
rotate_in_place_angle: 0.45
rotate_in_place_gain: 1.50
final_yaw_gain: 1.20
replan_min_interval: 0.25
replan_deviation_distance: 0.80
stuck_timeout: 12.00
progress_distance: 0.03
progress_angle: 0.12
stuck_command_speed: 0.05
blocked_recovery_timeout: 5.00

# 全向局部轨迹与有限次卡死恢复。
local_rollout_time: 0.80
# 正常跟踪先只采样 vy=0；以下值只用于 LATERAL_AVOID，recovery 不受此限制。
local_lateral_speed: 0.08
path_align_enter_angle: 0.45
path_align_exit_angle: 0.20
path_align_max_angular_speed: 0.35
track_lateral_enter_distance: 0.10
track_lateral_exit_distance: 0.05
track_lateral_recover_cycles: 3
track_lateral_blocked_cycles: 2
# 控制计算与 20 Hz 发布分离；已验证命令超过该 TTL 立即停车。
local_command_ttl: 0.20
# DWA 动态窗口由 /danger_search/cmd_vel_sent 的实际限幅后速度生成。
local_linear_accel: 1.0
local_lateral_accel: 1.0
local_angular_accel: 2.0
path_distance_weight: 3.0
path_align_weight: 1.5
path_progress_weight: -2.0
clearance_weight: -0.5
command_change_weight: 0.8
lateral_penalty_weight: 1.0
twirling_penalty_weight: 0.3
oscillation_reset_distance: 0.05
oscillation_reset_angle: 0.20
# 贪心捷径只接受比原 A* 区段少不超过此值的最小净空。
path_shortcut_clearance_loss: 0.02
recovery_max_attempts: 2
recovery_speed: 0.15
recovery_target_distance: 0.40
recovery_min_distance: 0.20
recovery_max_distance: 0.50
recovery_time_allowance: 15.0
recovery_no_progress_timeout: 5.00
recovery_progress_distance: 0.01
