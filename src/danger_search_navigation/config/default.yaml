# 导航控制模块参数
# 探索规划接口规范 v1.0 对齐 - move_base Action 模式

# 输入话题
pose_topic: /localization/pose
map_topic: /map
pointcloud_topic: /livox/Pointcloud2

# Action & 服务
move_base_action_name: /move_base
make_plan_service: /move_base/make_plan
clear_costmaps_service: /move_base/clear_costmaps

# 输出话题
cmd_vel_topic: /danger_search/nav_cmd_vel
path_topic: /navigation/path
health_topic: /navigation/health

# 坐标系
map_frame: map
base_frame: base

# 控制参数
max_linear_speed: 0.8
