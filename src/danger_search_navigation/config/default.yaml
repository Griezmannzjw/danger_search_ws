linear_gain: 0.8
angular_gain: 1.5
goal_tolerance_xy: 0.15
goal_tolerance_yaw: 0.2
control_rate: 20

# 避障参数（首版占位）
obstacle_safety_dist: 0.5

# 超时
goal_timeout: 30.0
