global_frame: map
robot_base_frame: base
update_frequency: 3.0
publish_frequency: 2.0
transform_tolerance: 0.50
rolling_window: false
track_unknown_space: true
always_send_full_costmap: false

plugins:
  - {name: static, type: costmap_2d::StaticLayer}
  - {name: obstacles, type: costmap_2d::ObstacleLayer}
  - {name: inflation, type: costmap_2d::InflationLayer}

static:
  map_topic: /map
  subscribe_to_updates: false
  track_unknown_space: true
  lethal_cost_threshold: 65
  trinary_costmap: true

obstacles:
  observation_sources: scan depth_scan
  scan:
    data_type: LaserScan
    topic: /localization/scan
    marking: true
    clearing: true
    expected_update_rate: 0.50
    observation_persistence: 0.30
    obstacle_range: 3.0
    raytrace_range: 4.0
    inf_is_valid: false
  depth_scan:
    data_type: LaserScan
    topic: /localization/depth_obstacle_scan
    marking: true
    clearing: false
    expected_update_rate: 0.0
    observation_persistence: 0.30
    obstacle_range: 3.0
    raytrace_range: 3.0
    inf_is_valid: false

inflation:
  inflation_radius: 0.55
  cost_scaling_factor: 5.0
